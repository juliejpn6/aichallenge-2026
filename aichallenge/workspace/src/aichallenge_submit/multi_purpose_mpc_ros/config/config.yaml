common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv.csv"
  resolution: 0.6
  # 2→1(2026-07-05): 平滑窓は「点数」定義で、CSV1m間隔では±2点=実幅±2m → κ·a²/6≈0.11-0.16mの
  #   内側化(実測: 内部参照がCSV原線よりコーナーで中央+0.13m/最大+0.23m内側)。±1mで→約0.03mへ
  smoothing_distance: 1
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  # width→safety_margin=width/√2 でコリドー控除。1.9に下げた検証(run 192420)は、左カーブのインは使えたが
  #   最終S字で切り込み過多→内壁crash(ey-3.15)。行き過ぎと判断し 2.30 に復元。turn-inは操舵側で対処する。
  width: 2.30   # +safety margin

mpc:
  N: 20
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  # 第1バッチ(turn-in解放): R[delta] 0→500。舵レートをソフトに罰して振動を抑える。
  #   steer_rate_max を上げる際の必須の相方(過去 R[delta]=0 で緩和→振動した反省。iASL=2位は 2.5+500 で成立)。
  # 500→1000実験(2026-07-23、166節続報)→撤回: r_drate=3e6と併用したところ、直線
  #   (std2.1→3.1°)・wp78(std4.6→5.6°)・wp257(std6.5→8.1°)いずれも悪化した。
  #   r_drate(曲率変化率)とR[delta](操舵入力の大きさ)が同じ操舵自由度を奪い合い、
  #   QPがQ[e_psi]追従との綱引きでかえって揺れる結果になったと推測。500へ復帰。
  # R[v] 1e5→2e5実験(2026-07-23、166節続報)→撤回: r_drate=3e6単独と比べ、直線
  #   (std2.1→1.8-3.1°、幅あり)・wp78(std4.6→3.9-5.6°)・wp257(std6.5→5.8-9.1°、
  #   悪化したラップあり)と明確な改善が見られなかった。1e5へ復帰。
  # R[kappa] 500→800実験(2026-07-27、206節、Gemini相談・最終確認テスト)→棄却:
  #   r_drate=3e6を堅持したまま試したが、実測(run_dev_20260727_181435)で直線
  #   std=3.86°→4.29°へ悪化し、Gemini自身が定めた棄却基準(<3.5°)を満たさなかった
  #   ため500へ復元。166節続報の500→1000実験と同種の悪化パターンが、変更幅を
  #   小さくしても再現した形。
  R: [100000.0, 500.0]
  # --- R[delta]曲率スイング・スケジュール(2026-07-24、176節続報): 揺れの原因が曲率の
  #   大きさではなく「短距離で曲率が符号反転するシケイン区間」(kappa swing、176節で
  #   r=0.807の強相関を実測)と判明したことを受け、シケイン検知時のみR[delta]を引き上げる。
  #   上のR[delta] 500→1000実験(常時・一律)は既に撤回済みだが、今回はシケイン区間のみ
  #   への限定的な引き上げである点が異なる。閾値は176節の実測(揺れの少ない15区間の平均
  #   swing=0.065、揺れワースト15区間の平均swing=0.339)を踏まえ、通常コーナーでは
  #   発動せずシケインでのみ立ち上がるよう設定。まず控えめな値から検証する(「滑らかな
  #   走行を最優先」というユーザー方針、166-24節と同じ姿勢)。
  # 2026-07-24/25単独実験(178節、A/Bテスト→復帰): dev3(3台自己対戦)実走行(output/20260724-175935)で
  #   超過率29.5-52.75%(dev3+CPU制限の既知基準6.31%を大幅超過)を観測し、本機構が原因か疑って
  #   boost=0.0(実質無効化)で同条件再走行(output/20260725-083853)したところ、超過率は
  #   31.75-45%とほぼ同水準のまま(r_delta_swing_total計測でも全体コストavg 0.1msと無視できる
  #   大きさ、updates回数も起動時の1回で固定)だった。単独変数のクリーンなA/Bにより、本機構は
  #   処理落ちの原因ではないと判定(=dev3環境自体が元々25ms予算にギリギリという別の未解決課題)。
  #   400.0へ復帰する。dev3環境の重さ自体は別途対処が必要(design_docs 178節参照)。
  r_delta_swing_boost: 400.0     # [R[delta]] シケイン最大時にR[1]へ加算する量(500+400=900上限)
  r_delta_swing_kappa_lo: 0.12   # このswing未満は加算なし(通常コーナーの平均0.065は含まれない)
  r_delta_swing_kappa_hi: 0.30   # このswing以上で加算最大(シケインワーストの平均0.339相当)
  r_delta_swing_lookahead_wp: 16 # [wp] 前方何点先までの範囲でmax-min(swing)を取るか
  r_delta_swing_ema_beta: 0.15   # EMA平滑化係数(既存q_ey/lat_ttcと同値、経路自体の局所ノイズを均す)
  # 公式ペナルティ(OVER): 指令加速度が ±3 m/s^2 を超えると 2秒間5km/h上限。
  #   かつ AWSIM は入力を ±1.37 m/s^2 で clamp する → 1.37超の指令は無意味かつ違反リスクのみ。
  #   → 有効最大の 1.37 に設定(effを最大化しつつ違反閾値±3に安全マージン1.63)。
  #   MPCの内部モデルも実機の到達加速度と一致し、速度計画の楽観ズレも解消。
  a_min: -1.37 # m/s^2 (旧 -3.0: 違反境界ちょうど＆-1.37止まりで無意味だった)
  a_max: 1.37 # m/s^2 (旧 3.2: ±3超過でOVERペナルティを誘発していた)
  delta_max_deg: 52.0 # degrees (第2バッチ: 45→52 iASL値。turn-in強化。直線→左カーブの逸脱対策)
  # アクチュエータ実測(2026-07-03 bag解析): 実舵レート上限≈109°/s, むだ時間≈200ms, 大舵角ゲイン0.67。
  #   raw指令は×gain(1.639)でタイヤ角になるため、raw 1.5rad/s は 141°/s 相当=実機超過(実現不能な計画→遅れ→スナップ振動)。
  #   109°/s ÷ 1.639 = 1.16 → 1.1 に設定し「実機ができることだけを計画」する(2026-07-03確定値)。
  # 2026-07-24単独実験(dev3自己対戦で検証)→撤回: 1.1→0.7では直線std2.1-2.9°→4.44°(悪化)・
  #   wp78 std4.3-5.0°→5.54°(悪化)・wp257 std6.1-6.8°→5.87°(ほぼ同等)と改善が見られなかった。
  #   1.1時点で既にusage中央値17%・80%超3.4%のみ(non-binding)だったことと整合する結果。1.1へ復帰。
  steer_rate_max: 1.1 # rad/s raw (旧1.5→1.1確定。0.7実験は効果なく撤回)
  control_rate: 40.0 # Hz (2026-08-02: Phase 5 C4実験完了、262節続報。40.0へ復帰)
  # 2026-08-01追加(262節続報、判定基準改訂+work_cpu計装Phase 4、C3実験用): mpc_controller
  #   プロセス自身をos.sched_setaffinityで指定コアへ固定する(コンテナ全体のcpuset隔離
  #   ではない——C2実測でコンテナ全体を狭いコア集合へ縛ると、同居する他ROS2ノードとの
  #   内部SMT競合でむしろ悪化することが判明したため、mpc_controllerプロセス単体のみを
  #   対象にする)。既定は空リスト=無効(現状と完全に同一挙動、何も変更しない)。
  #   計測の判定閾値ではなく実際のCPUバインドという制御外の運用パラメータのため、
  #   レートスケーリングの換算対象外(test_rate_scaling_254.pyのEXEMPT_PARAMSに登録済み)。
  cpu_affinity: []  # 例: [2, 3] で論理CPU2-3へ固定。空なら無効
  #   (2026-08-02 Phase 5でC4実験([2, 3, 4, 5])完了。計測後[]へ復帰)
  # 2026-08-01較正(72Hz切替準備Phase 4、単一車両+対戦車あり2回の実機ベースラインで確定):
  # ①単一車両(AWSIM単体、約10.7分・25,600周期): 窓ごとp99は最悪37.04〜68.43ms
  #   (64窓平均49.01ms)、budget=25msとの差(正側)は最悪43.43ms。
  # ②対戦車あり2両編成(dev2、各車約12分): phaseA(コリドー計算)は対戦車の
  #   ラスタライズ負荷で①の2倍程度(avg 5-6ms、①は2-3ms)に増加し、窓ごとp99は
  #   最悪89.30ms(d2)まで悪化した(budgetとの差=64.30ms)。ただしphaseB
  #   (組み合わせ探索)は今回の走行では一度も起動しなかった(対戦車ありでも
  #   ego前方視線が複数区間に分断される幾何条件が発生しなかったため。
  #   合成ゴールデン/ファジングケースが引き続きphaseB性能の唯一の実測根拠)。
  # より負荷の重い②の最悪値(64.30ms)に1.3倍の余裕を掛けた83.6msを丸め、
  # ε=85msとした(①のみに基づく55msでは②のような高負荷時に余裕が不足する
  # ため、より保守的な②を採用)。マージン無し(0ms)では①ですら健全な40Hz
  # 走行でもover_budget=約49%(ほぼ半数の周期でdt>budgetの誤検出)だったが、
  # ε=55ms適用時点で②のover_budgetは既に0.3〜0.5%まで低下しており(実測)、
  # ε=85msはさらに保守的な安全側の値である。
  # [PERF]側(処理時間work)は①でavg 8.55ms・>25ms該当は400周期中平均3.27回のみで、
  # dtの超過率(①49%/②較正後0.3-0.5%)との乖離が「処理落ちではなくrclpy.Rate
  # 自体のジッタが支配的」という仮説を裏付けている。なお①で1回だけmax dt=
  # 179.34msの外れ値を観測したが、起動直後(2窓目)の一過性トランジェントと
  # 判断し較正の母集団からは除外した(この単発事象を丸ごと吸収するほど
  # マージンを緩めると、真の劣化検出感度が落ちるため)。詳細はdesign_docsの
  # 該当節参照。
  perf_dt_over_margin_ms: 85.0
  # 2026-08-01追加(261節続報、72Hzスパイク調査Phase 3): work>予算×この倍率の
  # 周期を[PERF-SPIKE]として1行ダンプする発火閾値。既定2.0(=40Hzなら50ms、
  # 72Hzなら27.8ms)。計測の判定閾値でありレートスケーリング対象外
  # (perf_dt_over_margin_msと同じ扱い)。
  perf_spike_dump_factor: 2.0  # 既定値へ復帰(2026-08-01調査時は1.2まで下げて検証したが、
                                # それでも40Hz・単一車両・10分間でゼロ件だった。詳細はdesign_docs
                                # 261節続報参照。今後72Hz等で再調査する際は必要に応じて再度下げる)
  steering_tire_angle_gain_var: 1.639
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  # 1.0(無効)→0.35(2026-07-23、166節続報): 加速指令が終始+1.37/-1.37を往復する
  #   バンバン挙動(直線でも発生、166-25節)を直接平滑化できるか検証する単独変数実験。
  #   steer_low_pass_gainで既に検証済みのバランス点(0.35)を出発点として採用。
  #   r_drate=3.0e6・steer_low_pass_gain=0.35は維持。
  accel_low_pass_gain: 0.35
  # 0.35→0.2実験(2026-07-23、166節続報)→撤回: フィルタを強め遅れを増やしたところ、
  #   直線std2-3°→12.95°・wp78 std4-5°→9.96°と大幅に悪化(反転頻度は減ったが振幅が
  #   激増=閉ループの安定性そのものを損なう典型パターン)。フィルタの遅れが既存の
  #   アクチュエータ遅れ(200ms)と合わさり閉ループを不安定化させたと推測。0.35へ復帰。
  # 0.35→0.5実験(2026-07-23、166節続報)→撤回: 逆方向(遅れを減らす)も直線std2-3→
  #   3.1-4.9°・wp78 std4-5→5.6-7.7°・wp257 std6-7→9.0°と悪化。0.2(強化)・0.5(弱化)
  #   どちらの方向へ動かしても悪化したため、0.35は既にこの系の局所最適点に近いと判断。
  #   このレバーでの追加改善は見送り、0.35で確定。
  steer_low_pass_gain: 0.35 # PlanB: 1.0→0.5→0.35(2026-07-04)。出力ステアを平滑化(u=last+(new-last)*gain)。
                            #   実測: raw出力が36Hz方向反転・コーナーp2p±25°。0.35で交番振幅を約1/2に低減。
                            #   追加遅れ≈+20ms(アクチュエータ遅れ200msに対し小)。v_max引き上げ時の安定担保
  # 内巻き決定実験(2026-07-05): 実測で内巻き量が曲率に正確に比例(cut≈7.3κ: 緩0.85m/κ0.12,
  #   ヘアピン1.49m/κ0.20)。κ比例バイアスの機構は wp_id_offset の先読み参照(2wp≈2m先の接線=
  #   κ×2rad内向き)に Q[e_psi](9e7,支配的)が整列するもの、が有力仮説。2→1でスロープが半減
  #   (95%点1.5→0.75m級)すれば因果確定。遅れ補償の減少分はLPF/レート計画が既に担う。
  wp_id_offset: 1        # 決定実験の結論(2026-07-05): 2→1で内巻き半減(1.49→0.83m, κ比例仮説確定)。
                         #   0は逆効果: 遅れ補償(1点≈1m≈0.24s≒アクチュエータ200ms)を失いターンイン遅れ
                         #   →奥で急舵→内外の暴れ(ステアstd10.5→11.8, 外側-0.21m出現)。**1が最適点**
                         #   (15km/h基準。inside-cut用の下限値として維持、以下のdelay_t_delay_sで
                         #   速度に応じて動的に上乗せする)。
  # 2026-07-26追加(徹底解析: アクチュエータ遅延の速度依存性、186/187節): 実測(2026-07-03、
  # r=0.992)確認済みの操舵アクチュエータ遅延(≈200ms)は速度に依らない固定の"時間"。
  # wp_id_offsetは固定の"距離"(1点≈1m)のため、速度が上がるほど実効補償時間が目減りする
  # (20km/hでは≈180ms<200msに不足)。T_delayをもとに毎周期wp_id_offsetを動的に底上げする
  # (上記wp_id_offset=1を下回ることはない)。開始値は実測値(200ms)、他速度のログが
  # 集まり次第再調整する。
  delay_t_delay_s: 0.2    # [s] 操舵アクチュエータ遅延の推定値(2026-07-03実測基準)
  use_max_kappa_pred: false # 第1バッチ: true→false。CSV kappaの過大スパイク(s=252等)にMPCが踊らされるのを防ぐ(iASL=false)
  # 2026-07-27追加(デバッグ専用、196節続報): [STEER-XCORR]実測で、予選環境の実効遅延(median
  #   190ms)がローカル(130-140ms)より+50-60ms大きいと判明。この差を意図的にローカルへ注入し、
  #   予選環境と同様の蛇行(e_y std≈0.29m)が再現するかを検証する実験用パラメータ。
  #   既定0.0=完全に無効(従来と同一の即時publish)。rqtでライブ変更可
  #   (param名: debug_extra_actuator_delay_s)。競技提出時は必ず0.0のまま維持すること。
  debug_extra_actuator_delay_s: 0.0 # [s]
  # 横目標を「壁コリドー中心」→「レースライン(e_y=0)」へブレンドする重み。
  #   0.0 = 従来(中心追従, 回帰安全) / 1.0 = レースライン追従 / 中間も可。
  #   既存の lateral_blend/lateral_target 機構を再利用（通常走行=非追い越し・非ピット時のみ適用）。
  #   壁はコリドー(safety_margin込み)でハード拘束されるため、レースラインが壁に近い箇所は端にクランプ。
  #   段階検証用に rqt でライブ変更可（param名: line_follow_w）。
  #   検証済(run 162541): 直線オフセット +0.55→+0.11、ヘアピンの±2m振動を抑制、9周無衝突 → 1.0採用。
  # 2026-07-25単独実験(179節続報、候補②検証): 直線含め全区間で不安定というユーザー報告を受け、
  #   「EKFノイズ×line_follow_w=1.0の厳密追従」仮説(175節時点で保留していた候補②)を検証した。
  #   0.0テスト(output/20260725-125213)の結果: track全体std 8.63°→8.00°(-7%程度)と小さく、
  #   箇所によって改善/悪化が混在し、単独では蛇行の主因ではないと判断した。ただし上記run 162541の
  #   知見(1.0でヘアピン振動抑制・直線オフセット改善)は無視できないため、両極端を避け中間値0.5へ
  #   設定する(レースライン追従とコリドー中心追従を半々でブレンド)。
  line_follow_w: 0.5


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  #v_max: 30.0   # km/h
  #ay_max: 12.0  # m/s^2, maximum lateral acceleration in curves
  # Q: [e_y, e_psi, t]  e_y を 6e5→5e6 に強化したらコーナー3は通過したが、横誤差(自己位置ノイズ約0.3m含む)を
  #   過剰に追い回しステアが小刻みに振れた(直線ステアstd 1.38→1.92°, 符号反転 2.0→3.7/100)。また切り返しS字で
  #   オーバーシュート→左壁衝突。→ 5e6 は上げ過ぎと判断し 2e6 へ戻す(元6e5より締め、ブレ/オーバーシュートを抑える中間点)。
  #Q: [2000000.0, 100000000.0, 2000000.0]
  #QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
