common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv.csv"
  resolution: 0.6
  # 2→1(2026-07-05): 平滑窓は「点数」定義で、CSV1m間隔では±2点=実幅±2m → κ·a²/6≈0.11-0.16mの
  #   内側化(実測: 内部参照がCSV原線よりコーナーで中央+0.13m/最大+0.23m内側)。±1mで→約0.03mへ
  smoothing_distance: 1
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # kappaへのSavitzky-Golay空間フィルタ(局所多項式平滑化)。220節で確定(true)。
  #   変更履歴・根拠はMPCパラメータ一覧アーティファクト⑥参照。
  use_savgol_kappa: true
  savgol_window_length: 7  # [点数] 奇数必須。前後3点=計7点。
  savgol_polyorder: 2      # 局所多項式次数。ピーク曲率を潰さないための2次。
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  # width→safety_margin=width/√2 でコリドー控除。1.9に下げた検証(run 192420)は、左カーブのインは使えたが
  #   最終S字で切り込み過多→内壁crash(ey-3.15)。行き過ぎと判断し 2.30 に復元。turn-inは操舵側で対処する。
  width: 2.30   # +safety margin
  # EKF曲率依存横バイアス補正(State Sanitizer)。227節でローカル・予選両方の
  #   悪化を確認し無効化(false)確定。変更履歴はMPCパラメータ一覧⑥参照。
  use_curvature_bias_correction: false
  curvature_bias_slope: 0.772
  curvature_bias_intercept: 0.016
  # actuator_gain: delta_actual状態が定常収束する先を指令deltaの何倍にするか(既定1.0)。
  #   2026-08-03、ローカル実走行でgain=0.67を試したところ「切りすぎ(過剰操舵)」が
  #   目視で確認され、estimate_gain_continuousの実測(0.67)自体が振動信号への回帰に
  #   よる過小評価アーティファクトだった疑いが強まったため、1.0(無効)へ復元。
  #   design_docs/axis06_gain_correction_design_20260803.md参照(再検証要)。
  actuator_gain: 1.0

mpc:
  N: 20
  # Q: [e_y, e_psi, t, delta_actual](4要素、delta_actual状態拡張済み。常時4要素で記述)
  # R: [v, delta]
  # QN: [e_y, e_psi, t, delta_actual]
  # 全パラメータの変更履歴・実験結果はMPCパラメータ一覧アーティファクトを参照:
  #   https://claude.ai/code/artifact/75c03a46-3f85-40cc-8e8c-51b1f42d472e
  R: [100000.0, 500.0]  # R[v]/R[delta]。R[delta]は166/206節の実験で500に確定(①②参照)
  # R[delta]曲率スイング・スケジュール(176節): シケイン区間(kappa swing大)のみ
  #   R[delta]を動的に引き上げ、揺れを抑える。178節でdev3処理落ちの原因ではないと確認済み。
  r_delta_swing_boost: 400.0     # [R[delta]] シケイン最大時にR[1]へ加算する量(500+400=900上限)
  r_delta_swing_kappa_lo: 0.12   # このswing未満は加算なし(通常コーナーの平均0.065は含まれない)
  r_delta_swing_kappa_hi: 0.30   # このswing以上で加算最大(シケインワーストの平均0.339相当)
  r_delta_swing_lookahead_wp: 16 # [wp] 前方何点先までの範囲でmax-min(swing)を取るか
  r_delta_swing_ema_beta: 0.15   # EMA平滑化係数(既存q_ey/lat_ttcと同値、経路自体の局所ノイズを均す)
  # 公式ペナルティ(OVER)対策: AWSIMの実クランプ値(±1.37 m/s^2)に合わせ較正済み。
  a_min: -1.37 # m/s^2
  a_max: 1.37 # m/s^2
  delta_max_deg: 52.0 # degrees (iASL値。物理最大転舵角80°に対するMPC側ソフト上限)
  # アクチュエータ実測(2026-07-03): 実舵レート上限≈109°/s → raw 1.1rad/sに較正済み確定値。
  steer_rate_max: 1.1 # rad/s raw
  control_rate: 40.0 # Hz。72Hz化調査は継続中(未採用)。2026-08-04: PartA(FAILSAFEストール注入テスト)をSet A同一構成でクリーンに検証するため40Hzへ復元。詳細はdocs/superpowers/specs/2026-07-31-mpc-control-rate-increase-design.md参照
  # mpc_controllerプロセスをos.sched_setaffinityで指定コアへ固定する72Hz調査用の実験パラメータ
  #   (262節続報)。既定は空リスト=無効(現状と完全に同一挙動)。レートスケーリング対象外。
  cpu_affinity: []  # 例: [2, 3] で論理CPU2-3へ固定。空なら無効
  # [PERF-DT]の周期超過判定マージン(dt>予算+ε)。実機ベースラインで較正済み(262節続報)。
  perf_dt_over_margin_ms: 85.0
  # [PERF-SPIKE]の発火倍率(work>予算×この値)。計測の判定閾値でありレートスケーリング対象外。
  perf_spike_dump_factor: 2.0
  # [PERF-DT-SPIKE]の発火倍率(dt>予算×この値)。764msストール(全ノード同時停止、
  #   work基準の[PERF-SPIKE]では捕捉不能)の発見を受けて追加(263節続報Part A-1)。
  #   計測の判定閾値でありレートスケーリング対象外。
  perf_dt_spike_factor: 5.0
  # dt異常フェイルセーフ(watchdog)の発火閾値。764msストール(263/266節)から復帰した
  #   直後のワインドアップ(古い状態量に基づく過大な指令の発行)を防ぐため、この閾値を
  #   超えた周期のみ発行コマンドを安全側(操舵保持・速度0・a_minでブレーキ)へ上書きする
  #   (264節続報Task1)。<=0で無効化。実測(0801-01/0802)で健全時のdt最大は95ms程度の
  #   ため、200msは十分な安全マージンを持ちつつ通常のジッタでは誤発火しない値。
  #   絶対時間(ms)のためレートスケーリング対象外。
  failsafe_dt_threshold_ms: 200.0
  steering_tire_angle_gain_var: 1.639  # MPC生指令→実タイヤ角の換算ゲイン(実機較正値)
  # 出力操舵/加速度の平滑化フィルタ(u=前回+(今回-前回)×gain)。166節の実験で0.35が
  #   両方向(強化/弱化)とも悪化する局所最適点と確定(詳細はMPCパラメータ一覧⑤参照)。
  accel_low_pass_gain: 0.35
  steer_low_pass_gain: 0.35
  # wp_id_offset: 先読み参照点数。2026-07-05決定実験で15km/h基準は1が最適と確定
  #   (詳細はMPCパラメータ一覧⑥参照)。20km/h以上は速度スケーリングで動的に底上げされる。
  wp_id_offset: 1
  delay_t_delay_s: 0.2    # [s] 操舵アクチュエータ遅延の推定値(2026-07-03実測基準)
  use_max_kappa_pred: false # CSV kappaの過大スパイクにMPCが踊らされるのを防ぐ(iASL確定)
  # debug_extra_actuator_delay_s: 予選環境との遅延差分をローカルで再現する実験用パラメータ
  #   (196/197節)。既定0.0=完全に無効。rqtでライブ変更可。競技提出時は必ず0.0のまま維持すること。
  debug_extra_actuator_delay_s: 0.0 # [s] 2026-08-04: 予選提出前チェック(CLAUDE.md §1.2)により0.0へ復元
  # enable_diag_log: STEER-XCORR等の1Hz診断計算・ログI/Oの有効化(214節、予選3vCPU対策)。
  #   既定true(ローカル調査継続のため)、予選提出時のみfalseへ切り替える運用。
  enable_diag_log: false # 2026-08-04: 予選提出前チェック(CLAUDE.md §1.2)によりfalseへ
  # line_follow_w: 横目標を「壁コリドー中心」(0.0)〜「レースライン」(1.0)へブレンドする重み。
  #   179節の検証で単独犯ではないと判明し中間値0.5で確定(詳細はMPCパラメータ一覧⑥参照)。
  line_follow_w: 0.5


  # 速度プリセット: v_max/ay_max/Q/QNは速度帯ごとに切り替える。現在有効なのは「中速」ブロック
  #   (20km/h、241/243節の段階的引き上げ計画)。他は履歴としてコメントアウトで保存。
  #   Q/QNは全プリセットで4要素形式([e_y, e_psi, t, delta_actual])に統一済み(2026-08-02)。
  #   全パラメータの変更履歴・実験結果はMPCパラメータ一覧アーティファクト③⑦参照:
  #   https://claude.ai/code/artifact/75c03a46-3f85-40cc-8e8c-51b1f42d472e

  ## ---------- 究極 ------------- ##
  #v_max: 30.0   # km/h
  #ay_max: 12.0  # m/s^2
  #Q: [2000000.0, 100000000.0, 2000000.0, 0.0]
  #QN: [1000000.0, 1000000.0, 10000.0, 0.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0, 0.0]
  # QN: [1000000.0, 1000.0, 10000.0, 0.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0, 0.0]
  # QN: [1000000.0, 1000.0, 10000.0, 0.0]

  ## --- 中高速 --- ##
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0, 0.0]
  # QN: [1000000.0, 1000.0, 10000.0, 0.0]

  ## --------- 中速(現在有効) -------------- ##
  v_max: 20.0
  ay_max: 6.5

  ## -------- 低速 -------------- ##
  #v_max: 15.0
  #ay_max: 5.5

  # Q0(Q[e_y])は200,000で確定(2026-08-04、予選実地A/B/C比較、stage15 278節)。
  #   250節の700,000確定判断は270-271節の対数スイープ知見と矛盾していたが、
  #   実地(Set A vs Set B)で200,000が直線層wobble_std(17.35→5.87°)・
  #   wp269-282 p95|ekf_ey|(1.99→1.64m)とも明確に優位と確認され、250節の判断を覆した。
  # Q1(Q[e_psi])は1,000,000で確定(2026-08-04、ハード制約[wp269-282 stall/p95]先行判定、
  #   stage15 273-275節)。旧基準1e8から変更。
  Q: [200000.0, 1000000.0, 200000.0, 0.0]
  QN: [1000000.0, 1000.0, 10000.0, 0.0]
  # ay_profile: 曲率エンベロープ(v_max非適用)専用の横G予算。ヘアピン実測で較正済み確定値。
  ay_profile: 2.6
  # r_drate: ホライズン内Δκ²ソフトペナルティ。166/205/207節の実験で3.0e6が基準値と確定
  #   (詳細はMPCパラメータ一覧②参照)。
  r_drate: 3000000.0
  # use_osqp_update: 構造凍結テンプレート+update()によるfast経路(Stage1、2026-07-05導入)。
  use_osqp_update: true
  osqp_shadow_cycles: 50  # 起動直後、fast/legacy経路の等価性を機械検証する周期数

v2x_obstacle_avoidance:
  vehicle_radius: 0.8          # [m] 相手カート実横半幅(0.725)＋余裕
  v_max_safety: 6.0            # [m/s] 相手速度推定のサニティクランプ(物理的に不可能な値を丸める)
  position_jump_threshold: 5.0 # [m]
  n_pred_samples: 6            # 他車1台の予測軌道の点数。20→6でラスタライズ/QP拘束を削減(制御レート回復)
  speed_window: 6              # 相手速度の平滑窓[フレーム]。スパイク抑制(~0.46s@13Hz)
  # V2X速度クランプ時の下流フォールバック(2026-08-03、Part2/PartB-1)。クランプ発生時
  #   fwd_vopp=0=「相手完全停止」への誤認識でclosing_est(追い越し判断)が過大評価される
  #   危険な穴への対処。既定は無効(現行の0クランプ挙動を完全維持)。有効化は検証結果を
  #   見て人間が判断する(まだ未検証、デフォルトOFF)。
  clamp_hold_enabled: false          # true: 直前の有効速度を保持→鮮度切れ後は保守的値へ
  clamp_hold_freshness_s: 0.5        # [s] この時間以内は直前の有効速度をそのまま使う
  # clamp_fallback_mps未指定(コメントアウトのまま)ならv_max_safety自体を使う
  rebuild_deadband: 0.3        # [m] 障害物がこの距離以上動いた時だけ占有マップ再描画(コリドーのパタつき対策)
  # コリドー境界の拡大方向の回復レート上限(190-3節)。縮小方向は無制限即時反映(安全側)、
  #   拡大方向のみこの値[m/s]で1周期あたりの回復量を制限し不連続ジャンプを防ぐ。
  corridor_widen_rate_mps: 1.0 # [m/s]
  # 後方/前方車の予測円をマップに投入する距離範囲(ヒステリシス付き)。後方は自ライン維持の原則、
  #   前方はホライズン先端での誤ったコリドー削りを防ぐため近傍(追い越し対象域)のみに限定。
  rear_map_enter: 0.5          # [m] ds > -enter で予測円をマップに投入
  rear_map_exit: 1.5           # [m] ds < -exit で除外
  fwd_map_enter: 12.0          # [m] ds < enter で予測円をマップに投入
  fwd_map_exit: 13.5           # [m] ds > exit で除外

# 横方向TTC監視(2026-07-11設計、2026-07-12実挙動統合・案3で旧EMA判定を置換):
# 0711-02ログ3件の実測分析(側選択は正しいがロック後2〜4秒の再評価空白で相手の幅寄せに
# 追突する)への対処。giveup判定はLAT-TTCの4分岐(A/B/C1/C2)に一本化されている。
# 導入直後は`enabled`キーでの即時ロールバックに対応していたが、7/12以降無効化した
# 実績がなく、旧EMA経路自体を2026-07-17に削除したため`enabled`キーも削除した。
lat_ttc:
  beta: 0.15                    # EMA平滑化係数(強め。V2X/EKF由来の横位置ノイズ対策)
  ttc_danger_s: 2.0             # [s] この値を下回ったら3分岐判定を開始
  ttc_critical_s: 0.8           # [s] C-stage2(強制giveup)の閾値
  # giveup/switchback/cleared_space_mはalong_min_width(1.45、カート幅未満の物理下限)と
  #   同一値を維持する必要がある(85節、コード側既定値との不整合を修正した回帰)。
  #   test_config_yaml_consistency.pyが値の整合性を回帰チェックしている。
  giveup_space_m: 1.45          # [m]
  switchback_space_m: 1.95      # [m] giveup_space_m+反転マージン0.5m
  side_by_side_dlat_m: 1.6      # [m] 既存clear_lat_reacquireと同一値
  side_by_side_ds_m: 1.0        # [m] 既存clear_ds_besideと同一値(縦方向の真横判定)
  caution_speed_margin_kmh: 2.0 # C-stage1: 相手縦速度からこの分だけ引く
  min_trend_cycles: 3           # 誤発火防止: 連続この周期数縮小が続くまでTTC評価しない
  cleared_space_m: 1.45         # [m] 真横到達後の緩和閾値。along_min_widthと同一値
  v_inst_max: 5.0                # [m/s] v_inst(コリドー縮小瞬時微分)の物理妥当性クランプ

# スタック検知バック: 指令速度>実速度の乖離が続く(壁接触等で物理的に進めていない)場合のみ発動。
#   ギア/後退値はAutoware公式サンプル(autoware_practice_course/backward.cpp)準拠。
#   変更履歴はMPCパラメータ一覧アーティファクト⑪参照:
#   https://claude.ai/code/artifact/75c03a46-3f85-40cc-8e8c-51b1f42d472e
stuck_recovery:
  startup_grace_s: 10.0   # [s] START後この時間はスタック判定しない(START後の実発進は実測7.5〜8.75秒)
  u0_thr: 2.0            # [m/s] 指令速度がこれ以上
  v_thr: 0.3             # [m/s] 実速度がこれ未満
  hold_cycles: 60        # [周期] 継続でスタック判定(≈1.5s@40Hz。252節で120→60へ短縮)
  infeas_thr: 300        # [周期] u0を問わず連続infeasibleで即発動(≈7.5s@40Hz)
  # 2026-08-05拡大(293節、20→50): 予選ログ(0729-01、検知→確認まで一貫して約65ms)と
  #   ローカル全走行ログ(2026-07-23〜08-05、130件以上)の横断比較で、ローカルの
  #   REVERSE確認成功率が1%未満(soloでもdev3でも同様、CPU負荷は主因でないと判明)と
  #   確定した。唯一の局所成功例(20260805-065239)を精査すると、同一エピソード内で
  #   8回もWAIT_PARK→WAIT_REVERSE→BACKUP失敗を繰り返した末、前回サイクルの遅延応答が
  #   偶然追いついてconfirmedになっていた——AWSIM側の実際のギアシフト処理遅延が
  #   従来の待ち時間(≈0.5s)より長い可能性が高いという仮説に基づき拡大する。
  #   判断ロジック自体(confirmed OR timeout方式)は変更しない、待ち時間の数値のみ拡大。
  gear_settle_cycles: 50 # [周期] ギア切替の確定待ち(≈1.25s@40Hz、GearReport未配信環境向けの保険)
  # 2026-08-04追加: WAIT_PARKで「gear_report==PARK」が実質0周期で即confirmed=Trueに
  #   なる(前エピソードの残存状態を拾っている可能性)実測が本日5件見つかり、
  #   P→R遷移(WAIT_REVERSE)が全件失敗する主因の疑いが強い。confirmedを信用せず、
  #   WAIT_PARKは常にこの周期数だけ滞留してからWAIT_REVERSEへ進む(ローカルAWSIM
  #   限定の既知問題への対策、詳細は[[stuck-normal-handoff-infinite-loop-wall-pin-0804]])。
  # 2026-08-05拡大(293節、40→80→50): 当初はgear_settle_cyclesの2倍(80)へ拡大したが、
  #   「2倍」という倍率自体が2026-07-10時点の暫定値(実証的根拠なし、コメント原文
  #   「gear_settle_cyclesの2倍から開始する」)だったため、ユーザー指摘を受け
  #   gear_settle_cyclesと同値(50)へ統一した。役割は異なる(WAIT_PARKはconfirmedを
  #   信用せず常に無条件でこの周期数だけ滞留、WAIT_REVERSE/DRIVEはconfirmedなら
  #   早期終了)ため待ち時間の意味自体は残るが、数値を分ける根拠が無いため揃えた。
  gear_park_dwell_cycles: 50 # [周期] WAIT_PARKの固定滞留(≈1.25s@40Hz、gear_settle_cyclesと同値)
  # 2026-08-05追加(293節続報): dev3実測で待ち時間拡大単独では改善が確認できなかったため、
  #   毎周期(40Hz)連続でGearCommandを再パブリッシュし続ける動作がAWSIM側のシフト処理と
  #   干渉している疑いに基づき、状態遷移時(エッジ)は即座に送信・以後は指令値が変わらない
  #   間この周期数ごとに間引いて再送する方式へ変更した(完全な単発publishは配信ロス時に
  #   永久に届かなくなるリスクがあるため、低頻度のハートビート再送は残す設計)。
  gear_cmd_heartbeat_cycles: 8 # [周期] エッジトリガー後の再送間隔(≈0.2s@40Hz)
  backup_dist: 2.0       # [m] 後退距離
  backup_speed: -3.0     # [m/s] サンプル準拠
  backup_accel: 1.5      # [m/s^2] サンプル準拠
  hold_accel: -2.5       # [m/s^2] ギア切替待ち保持(サンプル準拠)
  # 経路3: 完全停止デッドロック対策。相手車に塞がれ続けMPCが安全停止を選び続ける
  #   デッドロックに対応(経路1/2は異常値発生前提のため構造的に発動しない)。
  stall_v_thr: 0.1       # [m/s] 「まったく動かない」判定(経路1のv_thr=0.3より厳格)
  stall_hold_cycles: 400 # [周期] これだけ継続→経路3判定(≈10s@40Hz)
  push_dist: 2.0         # [m] BACKUP後、前進突入(相手への押し出し)の目標距離
  push_speed: 3.0        # [m/s] 前進突入時の速度指令
  push_accel: 1.5        # [m/s^2] backup_accelを流用
  push_timeout_s: 2.5    # [s] 距離未到達でも打ち切る時間(実時間判定。252節で5.0→2.5秒へ短縮)
  # PUSH開始時、_plan_passが決めた側へ操舵を加える(低速+最大舵角、171節)。
  #   push_steer_max_degは明示設定せず、mpc.delta_max_degへ追従する。
  push_steer_room_ref: 1.0    # [m] この空きで上限角に到達(線形スケール、それ未満は比例縮小)
  stall_retry_budget_s: 360.0  # [s] 経路3の初回発火からこの時間内のみPUSHを再試行する(実時間判定)
  # BACKUPウォッチドッグ: PUSH/経路3と同様、実時間タイムアウトで無限固着を防ぐ。
  backup_timeout_s: 2.5        # [s] 後退距離未到達でも打ち切る時間(252節で5.0→2.5秒へ短縮)
  backup_retry_budget_s: 600.0 # [s] 初回タイムアウトからこの時間内のみWAIT_REVERSEへ再試行する
  # 後退不能検知: 物理的に後退できない(実速度v≈0)場合、タイムアウトを待たず即座に確定する。
  backup_blocked_v_thr: 0.05        # [m/s] この速度未満は「動いていない」とみなす
  backup_blocked_confirm_s: 1.5     # [s] この時間連続して動いていなければ後退不能と確定
  # 隙間狙い操舵(184節、壁リカバリーoff化に伴う対策): 後退時は隙間中心へ先頭を向け、
  #   後退→隙間への微調整前進を繰り返す(シャッフル)。
  gap_lookahead_n: 3          # [waypoint] 隙間中心の計算に使う先読み点数
  ey_kp: 0.8                  # [rad/m] 隙間中心への横方向誤差に対する比例操舵ゲイン
  psi_kp: 1.0                 # [rad/rad] 経路接線とのヨー誤差に対する比例操舵ゲイン
  rear_clearance_margin_m: 0.5  # [m] 後方の相手車との間に残す安全マージン
  rear_scan_max_dist_m: 3.0     # [m] 後方チェックの探索範囲(これより遠い相手車は無視)
  push_heading_tol_deg: 15.0    # [deg] PUSH終了判定(cleared)で許容するヨー誤差
  shuffle_max_cycles: 6         # [回] 同一スタックエピソード内でBACKUP→PUSHを繰り返す上限
  shuffle_episode_gap_s: 15.0    # [s] 前回PUSH終了からこの時間内の再スタックは同一エピソード扱い
  shuffle_episode_radius_m: 3.0  # [m] 前回PUSH終了地点からこの距離内なら同一エピソード扱い
  max_giveup_streak: 3            # [回] シャッフル上限到達後、操舵方向を反転して再試行する回数の上限
  push_min_dist_for_cleared: 0.15  # [m] PUSH「reason=cleared」判定に必要な最小実移動量
  # 2026-08-05追加(291節、STUCKエスカレーション欠如バグ対策): shuffle_max_cycles/
  #   max_giveup_streakの上限チェックはBACKUP-BLOCKED経路にしか実装されておらず、
  #   PUSH timeout(dist=0.00mでも無条件に完了扱い)を繰り返す経路には上限が無かった
  #   ため、shuffle_cycleが無制限に増加し続ける実害(0804/0805で2回、run全体
  #   [最大約30分]喪失)を確認した。経路に依存しない安全網として、
  #   _stuck_enter_wait_reverse()でこの値に達したら無条件にNORMALへ委譲する。
  shuffle_hard_limit: 20         # [回] 経路非依存の安全網。到達したら復帰断念しNORMALへ委譲
  # 自動衝突検知: 予選環境のbagにcondition系トピックがないため、実速度の急落を自車のみで直接監視する。
  collision_suspect_dv: 0.8  # [m/s] 1周期での急落閾値(正当な制動上限の何倍もの余裕を持たせた値)
  collision_suspect_cum_dv: 1.0    # [m/s] 直近collision_cum_window_cycles周期の最大値からの下落閾値
  collision_cum_window_cycles: 5   # [周期] 監視窓幅(≈0.125s@40Hz)
  # GHOST-BLOCK: 「知覚と現実の乖離」の早期検知(復帰動作はせずログのみ)。
  ghost_block_hold_cycles: 40      # [周期] ≈1s@40Hz

# gate2: 前方車の追い越し（方式A: 回避ONのままコリドーが空き側を自動選択）
# 下記は「追い越し可否・方向の判断」と「追い越し中の速度」を外から調整するためのパラメータ。
# gate1（両側塞がり→停止）の挙動は overtake では変えない（STOPPING で従来通り停止）。
overtake:
  enable: true            # false にすると gate1 と同じ「前方車検知=即停止」に戻る
  min_gap: 2.5            # [m] 片側にこの空き幅があれば追い越し可能側とみなす
  block_half: 0.9         # [m] 他車1台が塞ぐ横半幅 = vehicle_radius + クリアランス
  max_consider: 20.0      # [m] この弧長より遠い前方他車は判断に使わない
  v_cap: 6.0              # [m/s] 追い越し中の速度上限
  exit_clear: 3           # 前方クリアがこの回数連続で OVERTAKING→NORMAL 復帰(ヒステリシス)
  # Stage2: 相手速度に応じた追い越し判断(同等/速い相手を無駄に追わない=蛇行防止)
  opp_obstacle_speed: 6.0 # [km/h] 相手がこれ未満=停止/ペナルティ車→障害物として空き側から抜く
  opp_min_closing: 0.7    # [m/s] エンゲージ閾値: 接近率がこれ超で「追いつける」
  opp_giveup_closing: 0.2 # [m/s] コミット中、接近率これ未満がgiveup_cycles連続で追従へ離脱
  giveup_cycles: 40       # [周期] ≈1秒@40Hz
  engage_debounce: 8      # [周期] ≈0.2秒。worth=1がこれだけ連続して初めてエンゲージ
  engage_lat_max: 2.0     # [m] 相手のライン横位置|lat|がこれ以下=「進路上」の時だけエンゲージ
  engage_ego_margin: 0.3  # [m/s] v_ego > v_opp - これ でのみエンゲージ(自分が相手より遅すぎない事)
  engage_max_dist: 6.0    # [m] 前車との距離がこれ以下でのみエンゲージ(それまでは追従)
  # ema_alpha: 側コミットのEMA時定数(≈1秒@40Hz)。side_block/along_lat共通
  ema_alpha: 0.05
  engage_cooldown: 160    # [周期] ≈4秒@40Hz。失敗離脱後この間は再エンゲージしない
  t_lateral: 3.0          # [s] 横移動フェーズの所要時間(完遂距離チェックに使用)
  pass_block_kappa: 0.10  # [1/m] きついコーナー閾値(R≤10m、この内側は選ばない)
  pass_clear: 3.0         # [m] 抜き切り=相手の前にこれだけ出る
  pass_t_max: 8.0         # [m] パス所要時間の予算(超えるなら追従の方がロスが少ないと判断)
  def_enter_cycles: 5     # [周期] 被追い越し判定のデバウンス(ON、素早く)
  def_exit_cycles: 15     # [周期] 被追い越し判定のデバウンス(OFF、ゆっくり=チャタ防止)
  # H4-lite: infeasible自己ロックの前進リカバリ(壁際でMPC不可解→u0=0固着への対策)。
  unlock_inf_cycles: 80   # [周期] inf連続がこれ以上 かつ 車速<0.3m/s で発動(≈2秒)
  unlock_hold_cycles: 60  # [周期] 発動後の保持時間
  # ICC解放ヒステリシス(横1.8mで即全開→コーナー収束で接触、を防ぐ)。
  clear_lat_release: 2.1  # [m] 実横間隔これ以上で「クリア」→ICC解放
  clear_ds_beside: 1.0    # [m] または横1.8m以上かつ前後差これ以下(=真横到達)で解放
  clear_lat_reacquire: 1.6 # [m] クリア後もこれ未満に再接近したら再びICC対象
  # 守り: 被追い越し(横並び/後方から速い車)時は押し込まず、壁近接なら減速。
  def_alongside_dist: 3.0 # [m] |ds|がこれ以内かつ横にずれている=横並び
  def_alongside_lat: 1.0  # [m] 横並び判定に必要な横オフセット下限
  def_rear_dist: 8.0      # [m] 後方この距離以内に自車より速い車→被追い越しと判定
  def_rear_faster: 1.0    # [m/s] 後方車が自車よりこれ以上速ければ「抜かれる」と判定
  # wall_slow: 壁近接時の減速テーパー。123節で動的境界基準へ再較正(0.15)。
  wall_slow_enable: false  # 現在OFF(操舵振動の切り分け実験を継続、166節続報)
  wall_slow_margin: 0.15  # [m] コリドー境界までの追加余裕。これ未満で壁近接減速(テーパー開始点)
  wall_slow_speed: 2.0    # [m/s] 壁近接時の速度上限(テーパー下限)
  wall_slow_margin_hard: 0.0  # [m] これ以下で完全にwall_slow_speedへ(124節、線形補間の下端)
  # 並走の「ねばり」: 真横に並ばれても自分のレーンが確保できる限り減速しない。
  alongside_lane_need: 1.85   # [m] 並走継続に必要な自分側レーン幅(カート幅1.45+余裕0.4)
  alongside_lookahead: 8.0    # [m] レーン幅を先読みする弧長
  alongside_min_width: 1.45   # [m] カート幅未満の物理下限(side_block緩和閾値にも再利用)
  along_min_length: 2.00      # [m] カート全長未満の物理下限(127節、fwd_ds版のalongside_min_width)
  side_flip_hysteresis_s: 3.0  # [s] STOPPING離脱後、この時間内・同一対象車なら前回側を優先
  debug: true            # [OT]ログ(state/side/Lfree/Rfree)を出力。gate2課題切り分け用、現在ON
  gap_hys: 0.5           # [m] OVERTAKING維持の緩和量(min_gap-gap_hysを下回ったら離脱)
  infeasible_stop: 15    # MPCがこの回数連続infeasibleなら安全STOPへ
  infeasible_latch: 40   # 安全STOP後、OVERTAKING再挑戦を抑制する周期数
  # 方式B: 空き側へe_y目標をオフセット(発進時ランプ付き)。
  d_off: 3.0             # [m] 参照ラインから空き側へ寄せる量
  proactive_bias_max: 0.3  # [m] STOPPING中、停止/低速の相手へ先行して寄せる量の上限
  ramp_time: 2.5         # [s] オフセット0→fullの漸増時間(t_lateral=3sの計画と整合させた値)
  psi_bias_max_deg: 20.0 # [deg] ヘディング参照を開き側へ傾ける上限(横移動の主役はd_off)
  funnel_steps: 12       # コリドーを現在e_yから何wpかけて回避形状へ遷移させるか
  safety_margin_overtake: 0.8  # [m] 追い越し中の安全マージン(通常1.63より縮小)
  # 2026-08-05修正(293節続報、5,000,000->330,000): 旧基準(Q[e_y]ベース値3,000,000時代)の
  #   名残で、当時の比率(5M/3M≈1.67倍)のまま据え置かれていた。274節のQ[e_y]対数スイープで
  #   200k→2.8Mで蛇行が単調に約2倍悪化することが確定済みであり、5,000,000はその最悪値
  #   すら超えextreme。281節で既に比率保存候補(現行ベース200,000×1.67≈330,000)が
  #   特定されていたが検証中断のまま保留されていた。dev3実測(run7)でOVERTAKING中の
  #   ekf_ey振動([LOC-XCHECK]でwp90-108区間、-0.83〜+1.24mを往復)とステアリング急操作
  #   ([HOTSPOT-DEVIATION]でdelta_act_peakがdelta_expectedの最大3倍・符号反転)を実測、
  #   ユーザー指摘を受け比率保存値へ引き下げる。
  q_ey_overtake: 330000.0     # 追い越し中のQ[e_y](通常200,000の1.67倍、比率保存)
  # F3クリープ: 停止車の後ろでのデッドロック対策。hard_stop_gap〜f3_taper_gapを線形補間しfloorを滑らかに変化。
  v_creep: 1.5                 # [m/s] 未クリア時のクリープ前進速度
  hard_stop_gap: 1.8           # [m] 相手との実距離がこれ未満なら完全停止(最後の防壁)
  f3_taper_gap: 3.0             # [m] この距離以上でv_creepへ復帰
  return_done_ey: 0.7          # [m] 追い越し後|e_y|<これでライン復帰完了とみなし、戻りfunnelを解除

# ot_shadow_qp: OT判断のMPC化検討(Part B、2026-08-05)。左右へ完全コミットした場合の
# QPコストを本線とは別に解いて[OT-SHADOW]ログへ記録するだけの診断機能。既定OFF、
# ONでも本線のside選択・コリドー・状態機械には一切書き戻さない(design_docs 283/285節)。
ot_shadow_qp:
  enable: true           # 2026-08-05: 次回実走行でPart B([OT-SHADOW]ログ)を検証するためON
  period_cycles: 1       # [周期] この数おきに1回実行(間引き、[PERF]予算超過時は自動増加)

# 発進地点(車庫/ピット)とコース上を自動判別し、参照経路と速度を切り替える。
# gate1/gate2/gate3/eval 共通で機能（モード指定不要）。
#  - 発進時: レースライン距離が遠い→ピット経路(from_garage)、近い→レースライン。
#  - 走行中: レースラインに近づいたら(コースイン)レースライン(周回)へ一度だけ切替。
pit_lane:
  enable: true
  csv_pkg: "simple_trajectory_generator"               # ピット経路CSVのあるパッケージ
  csv_rel: "data/raceline_awsim_30km_from_garage.csv"  # 車庫発進経路（x,y,...,speed 列）
  enter_dist: 5.0        # [m] 発進時 レースライン距離>これ で「ピット」と判定
  course_in_dist: 3.0    # [m] レースライン距離<これ で「コースイン」→レースラインへ切替
  course_in_count: 5     # コースイン判定の連続周期数（ヒステリシス）
  v_max_pit_kmh: 3.0     # [km/h] ピット走行中の速度上限(狭い車庫出口の急曲がり対応)
  q_ey_pit: 50000000.0   # ピット走行中のQ[e_y](通常より大幅強化、レーン中央へ確実に寄せる)
  densify_resolution: 0.3 # [m] from_garage経路を3次スプラインで平滑・高密度化する間隔
  # 壁制約: 占有格子はピットで不正確なため、lanelet2地図のピットレーン境界を壁の真値として使う。
  lanelet_pkg: "aichallenge_submit_launch"   # lanelet2地図のあるパッケージ
  lanelet_rel: "map/lanelet2_map.osm"        # lanelet2地図(local_x/y, 同一座標系)
  safety_margin_pit: 0.9 # [m] ピット静的コリドーのマージン(実カート半幅0.725+緩衝0.175)
  # ピット低速時の方位補正: EKF方位は低速で実方位から約15-19°ずれるため、GNSS位置履歴から
  #   求めた実進行方位をMPCに与える。
  heading_track_dist: 0.4 # [m] 進行方位を求めるGNSS履歴の後方距離(短いほど追従↑だがノイズ↑)
