  #v_max: 20.0
  #ay_max: 6.5
  #Q: [3000000.0, 90000000.0, 100000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  #QN: [1000000.0, 1000.0, 10000.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # 2026-07-26、186節により15km/hへロールバック(上記参照)。
  v_max: 15.0
  ay_max: 5.5
  # 2026-07-24: v_max/ay_maxは低速プリセットのままQ/QNだけ中速値を意図的に使っていたが
  #   (20km/h引き上げ前の先行検証)、一旦純正の低速プリセット値へ戻し15km/hの基準を取り直した(169節)。
  # 2026-07-24単独実験(170節続報): 170節でQ曲率スケジュールを撤去した後もローカルで
  #   wp85-89/190-220/275-329が0723-083408ベースラインより悪化していた。0724-01→0724-02の
  #   悪化はスケジュールの有無ではなくQ[e_y]ベース値3M→5Mの変更(169節)と交絡していたと
  #   判明したため、Q[e_y]のみ中速値3,000,000へ戻し単独変数として検証する(Q[e_psi]/Q[t]/QNは
  #   169節の純正低速値のまま据え置き)。
  # 2026-07-27実験(201節→撤回、AXIS06): 予選環境の実効遅延(200ms、ローカル140msとの差60ms)を
  #   debug_extra_actuator_delay_s=0.055で再現した状態でQ[e_psi]を1e8→7e7へ緩める実験を行ったが、
  #   実測(run_dev_20260727_063549)で遅延あり時のstd=5.02°(旧基準4.06-4.26°より悪化)となり、
  #   「追従を緩めれば位相余裕が稼げる」という仮説は支持されなかったため1e8へ復元した。
  # 2026-07-27再実装(201節続報、AXIS06): delta_actual状態拡張(nx=3→4、198節で撤回済みを
  #   tau=55ms=環境差分のみへ変更して再挑戦、core/spatial_bicycle_models.py参照)に伴い、
  #   Q/QNとも第4要素(delta_actual)を追加。直接のコスト penalty は付けない(0.0)。
  Q: [3000000.0, 100000000.0, 200000.0, 0.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  QN: [1000000.0, 1000.0, 10000.0, 0.0]
  # 曲率エンベロープ用の横G予算(2026-07-04): ref_vel適用のフラット上書きで曲率減速が皆無になり
  #   ヘアピン(s≈72 R=6m / s≈169 R=8m)へ~20km/hで進入→毎周壁接触した対策。ay_profileは
  #   「現状の操舵系(遅れ200ms+36Hzチャタ)で追従できる予算」でグリップ限界(実測~20)ではない。
  #   R=6→15.1km/h, R=8→17.6km/h に進入(手前から制動)。直線・R≥12mは不変。チャタ修正後に引き上げ。
  ay_profile: 2.6         # 3.0→2.6(2026-07-04): R=6ヘアピンへ16-18km/hで進入しかすり→出口激突が
                          #   残ったため予算を下げる(R=6→13.4km/h)。P1/P3の操舵系修正後に引き上げ
  # PlanA r_drate(2026-07-04 実装): MPCコストに Δκ² ソフトペナルティを追加(ホライズン内の
  #   隣接κ差 + 前回適用κとの差)。実測: 生出力が36Hz方向反転・コーナーp2p±25° → 実効舵角権限を
  #   毀損しヘアピンでアンダー。0=無効(従来と同一QP)。目安: 正当な転舵(Δκ~0.05/step)のコスト
  #   500/step ≪ e_psi追従利得(~1.6e4)となる2e5から開始
  # 2e5→1.5e6(2026-07-04 run180153): P3緩和(旧制約=偶発的ダンパー)に対し2e5では負けて
  #   蛇行(ステアstd 10.7→17.5°)。正当な転舵(Δκ0.05)コスト≈3.8e3/step は追従利得より十分小
  # 1.5e6→3.0e6(2026-07-23、166節続報): wp78/wp257で見つけた「目標へ操作しすぎ→戻し
  #   すぎ」を繰り返すリミットサイクル(直線でも実速度・実舵角が同じ周期(約1.3秒)で
  #   振動、166-25節)が、既存r_drateの減衰不足によるものという仮説を検証する実験。
  #   単一変数のみ変更しR[delta]/R[v]は据え置き、効果を切り分ける。過去(82/83節)の
  #   教訓通り、上げすぎるとターンイン負けのリスクがあるため2倍(3.0e6)から様子を見る。
  # 3.0e6→1.0e6→3.0e6(2026-07-27、205節、AXIS06 delta_actual導入後のPhase1で実験→撤回):
  #   delta_actualが遅延を明示的にモデル化した(tau=190ms)ことでr_drateの役割が過剰に
  #   なった、という仮説(Gemini相談)を検証したが、実測(run_dev_20260727_174739)で
  #   直線std=3.86°→5.11°へ悪化し仮説は支持されなかったため3.0e6へ復元した。
  # 3.0e6→4.5e6→3.0e6(2026-07-27、207節、Gemini相談・コーナー立ち上がりリンギング対策
  #   →棄却): ユーザーの走行観察+定量分析(コーナー出口2.5秒以内リンギング)を受け
  #   ダンピング強化(1.5倍)を試したが、真の基準(r_drate=3e6・R[kappa]=500)と正しく
  #   再比較した結果、コーナー立ち上がり後std=6.10°→6.80°・持続直線std=3.17°→3.49°と
  #   両方悪化していたと判明(207続報2で訂正)。r_drateの増減・R[kappa]の増量いずれも
  #   悪化するとの結論(Gemini最終確認)により、AXIS06のQ/Rチューニングは真の基準値
  #   (このr_drate=3.0e6を含む)で確定し打ち切る。
  r_drate: 3000000.0
  # Stage1(2026-07-05): OSQP高速経路。毎周期の疎行列フル再構築(実測10.4ms/周期=予選40FPSで
  #   制御欠落100回/分の主因)を廃し、構造凍結テンプレート+値書込+update()に変更。
  #   適用はN固定・循環経路(レース周回)のみ。ピット等は自動でlegacy(フル構築)へ。
  #   起動直後 osqp_shadow_cycles 周期は両経路のQPを突き合わせて等価性を機械検証([OSQP-SHADOW]ログ)。
  #   不一致検出時は自動でlegacyへフォールバック(安全設計)。
  use_osqp_update: true
  osqp_shadow_cycles: 50
  # Plan C(根本原因の単独検証): Q[e_psi] 6e7→4e7。ヘディング支配 20倍→13倍。
  #   内側切り込み(コーナー93%イン)・直線逸脱の根治狙い。他は据置で効果を切り分け。
  #   下げ過ぎるとヘディング制御が緩みフラつくため小幅。フラつくなら5e7へ戻す。
  #Q: [3000000.0, 40000000.0, 2000000.0]
  #QN: [1000000.0, 1000000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 0.8          # [m] 相手カート実横半幅(0.725)＋余裕。過小表現是正（接触防止）
  # 2026-07-15修正: 30.0(108km/h)は本競技の全カート最高速度(15km/h=4.17m/s)から
  #   見て過大で、実質的にサニティクランプとして機能していなかった。0715-01実測で
  #   vopp(=相手速度推定)が6〜16m/sという物理的に不可能な値を頻発していたにも関わらず
  #   このクランプは一度も発動していなかった(30を超えないため)。15km/hに対し
  #   測定ノイズ/瞬間的な推定誤差の余裕を持たせつつ、明らかに不可能な値は確実に
  #   ゼロへ丸めるよう6.0(21.6km/h、約1.44倍のマージン)へ変更する。
  v_max_safety: 6.0            # [m/s]
  position_jump_threshold: 5.0 # [m]
  # B1(制御レート回復): 他車1台の予測軌道を何点の円で表すか。
  #   旧実装は MPC N(=20)点固定 → obs=台数×20(0.5s horizonに過剰・大幅重複)。
  #   6点なら間隔≈0.8m<直径1.6mで掃引被覆を維持しつつ obs を約1/3に削減 → ラスタライズ/QP拘束が減り
  #   22Hz→40Hz回復を狙う(避け方・コリドー位置は不変)。相対速度が高く隙間が心配なら 8/10 へ。
  n_pred_samples: 6
  speed_window: 6              # 相手速度の平滑窓[フレーム]。2→6でスパイク(27→17km/h)抑制。~0.46s@13Hz
  rebuild_deadband: 0.3        # [m] 障害物がこの距離以上動いた時だけ占有マップ再描画。V2X 13Hz毎の微小ゆらぎで
                               #     コリドー(ub/lb)が離散的に跳ぶ→ステアがパタつく問題(2026-07-03解析)の対策＋CPU軽減
  # 2026-07-26追加(190-3節、80節「コリドー境界のラチェットによるデッドロック」の一般走行版対処):
  #   reference_path.update_path_constraints()のコリドー境界は縮小方向にのみ即座にラチェットし、
  #   拡大方向はrebuild_deadband解除の瞬間まで一切反映されない(狭い方向の履歴だけが蓄積する)。
  #   結果、蓄積された狭まり分がdeadband解除の瞬間に一気に解消され、実測(直線+単独走行)で
  #   平均0.14〜0.32m・最大0.94mの不連続ジャンプとしてQPコリドー・wall_slow・switchback・
  #   オフセット目標クランプへ同時に伝播していた。縮小方向(安全側)は無制限のまま即座に反映し、
  #   拡大方向のみ1周期あたりの回復量をこの値[m/s]で制限する(corridor_widen_step_m=
  #   corridor_widen_rate_mps/control_rateへ変換してreference_path側へ渡す)。
  #   0.3mの典型ジャンプが約0.3秒で解消される値として1.0を初期値とする。
  corridor_widen_rate_mps: 1.0 # [m/s]
  # H1(2026-07-04): 後方車の予測円を占有マップに入れない。後方から高速接近する車の予測円がコリドーを削り
  #   egoを横へ押し出す(発進時に左壁へ3m逸れ22sスタック)のを根治。守りの原則=後方車には自ライン維持。
  #   検知系(ICC/守り/ねばり)は後方車を引き続き見る(マップの回避形状のみ前方・並走に限定)。
  #   境界フラッピング防止のヒステリシス: 後方 enter[m] を越えたら投入、exit[m] より下がったら除外。
  rear_map_enter: 0.5          # [m] ds > -enter で予測円をマップに投入(=真横〜前方)
  rear_map_exit: 1.5           # [m] ds < -exit で除外(間は前回状態を保持=13Hz出没によるコリドー明滅防止)
  # 遠方前方車の除外(2026-07-04): ホライズン先端(≈20m)の前方車の予測円がコーナー頂点の
  #   コリドーを削り、egoを外側へ押し出して毎周同地点(wp14)で外壁ヒット。縦方向の安全は
  #   ICC追従が担保するので、近傍(追い越し対象域)だけマップに入れる。H1(後方除外)の前方版。
  fwd_map_enter: 12.0          # [m] ds < enter で予測円をマップに投入(近傍=追い越し対象域)
  fwd_map_exit: 13.5           # [m] ds > exit で除外(間は前回状態保持=ヒステリシス)

# 横方向TTC監視(2026-07-11設計、2026-07-12実挙動統合・案3で旧EMA判定を置換):
# 0711-02ログ3件の実測分析(側選択は正しいがロック後2〜4秒の再評価空白で相手の幅寄せに
# 追突する)への対処。giveup判定はLAT-TTCの4分岐(A/B/C1/C2)に一本化されている。
# 導入直後は`enabled`キーでの即時ロールバックに対応していたが、7/12以降無効化した
# 実績がなく、旧EMA経路自体を2026-07-17に削除したため`enabled`キーも削除した。
lat_ttc:
  beta: 0.15                    # EMA平滑化係数(強め。V2X/EKF由来の横位置ノイズ対策)
  ttc_danger_s: 2.0             # [s] この値を下回ったら3分岐判定を開始
  ttc_critical_s: 0.8           # [s] C-stage2(強制giveup)の閾値
  # 2026-07-16修正(85節、水平展開監査で発覚): 2026-07-14に64/72節でコード側の既定値を
  # along_lane_need(1.85)からalong_min_width(1.45)へ変更したが、本YAMLがgiveup_space_mを
  # 明示的にハードコードしていたため(_lgetはYAML値を優先)、その修正は実走行に一度も
  # 反映されていなかった。switchback_space_mも同時に、giveup_space_m+反転マージン0.5mの
  # 関係を保つよう1.95へ更新する(1.45+0.5)。
  giveup_space_m: 1.45          # [m] 既存alongside_min_widthと同一値(カート幅未満の物理下限)
  switchback_space_m: 1.95      # [m] giveup_space_m+反転マージン0.5m
  side_by_side_dlat_m: 1.6      # [m] 既存clear_lat_reacquireと同一値
  # 2026-07-11修正: dlatのみでは「まだ相手の後方にいて真横ではない」場合でも誤って
  # is_side_by_side=Trueと判定してしまう(branch=Aが1度も発火しなかった有力仮説)。
  # 既存の_ot_cleared判定(「真横到達」=dlat AND ds<=clear_ds_beside)に合わせ、
  # 縦方向条件も追加する。
  side_by_side_ds_m: 1.0        # [m] 既存clear_ds_besideと同一値
  caution_speed_margin_kmh: 2.0 # C-stage1: 相手縦速度からこの分だけ引く
  min_trend_cycles: 3           # 誤発火防止: 連続この周期数縮小が続くまでTTC評価しない
  # 2026-07-13追加: 真横到達(_ot_cleared)後の緩和閾値。旧_ot_side_block_ema方式が
  # 持っていた「cl=1後は閾値を物理下限へ緩和する」二段階閾値をLAT-TTCへ移植したもの。
  # is_side_by_side(dlat<=1.6m、まだ寄せている最中)とot_cleared(dlat>=1.8m、既に
  # 十分離れた)は逆方向の条件のため、真横到達した瞬間にis_side_by_sideから外れ、
  # C1/C2が相手との実距離を見ずにコーナー形状によるコリドー自然収束を「相手に
  # 迫られている」と誤認しgiveupする事象(0713-04実測、fwd_dlat3m超でも発火)への
  # 対処。既存along_min_widthと同一値(新規チューニング値を増やさない)。
  cleared_space_m: 1.45         # [m] 既存alongside_min_widthと同一値(カート幅未満の物理下限)
  # 2026-07-14追加: v_inst(コリドー縮小瞬時微分)の物理妥当性クランプ。対象車切替検知
  # (2026-07-12)では捕捉できない外れ値(dt異常等、対象車不変でも発生)により、
  # v_inst=-22〜-27m/s級の値がfwd_dlat=3m超でも誤giveupを誘発していた事例を2件実測
  # (0713-05 wp16-21、0713-06 wp243-246)。既定値は実測の正当な危険域(-1〜-5m/s程度)を
  # 覆いつつ、上記の異常値を確実に弾ける水準。
  v_inst_max: 5.0                # [m/s] v_instの物理妥当性クランプ(この範囲外は丸める)

# スタック検知バック(2026-07-09): 指令速度>実速度の乖離が続く(壁接触等で物理的に
# 進めていない)場合のみ発動。ICCの意図的な低速追従(指令速度自体が低い)は該当しない。
# ギア/後退値はAutoware公式サンプル(autoware_practice_course/backward.cpp)準拠。
stuck_recovery:
  startup_grace_s: 10.0   # [s] START後この時間はスタック判定しない(過去ログ実測:
                          #     START後の実発進まで一貫して7.5〜8.75秒かかる。P→D待ちを
                          #     誤検知しないよう安全マージンを見て10秒に設定)
  u0_thr: 2.0            # [m/s] 指令速度がこれ以上
  v_thr: 0.3             # [m/s] 実速度がこれ未満
  hold_cycles: 120       # [周期] 継続でスタック判定(≈3s@40Hz)
  infeas_thr: 300        # [周期] H4-liteに猶予を与えた上でこれ以上連続infeasibleなら
                          #     u0を問わず即発動(≈7.5s@40Hz)。実測: 復帰直後にu0=0のまま
                          #     infeasが31秒間張り付いた事例があり、u0ベース判定だけでは
                          #     この詰まり方を検知できなかった
  gear_settle_cycles: 20 # [周期] ギア切替の確定待ち(≈0.5s@40Hz)。GearReportで確認できれば
                          #     即進むが、確認できなくても(gear_status未配信環境向け)この
                          #     周期数が経過すれば進める(2026-07-10: gear_status未配信により
                          #     従来のタイムアウト=中断方式だと永久にBACKUPへ進めなかった実測あり)
  backup_dist: 2.0       # [m] 後退距離
  backup_speed: -3.0     # [m/s] サンプル準拠
  backup_accel: 1.5      # [m/s^2] サンプル準拠
  hold_accel: -2.5       # [m/s^2] ギア切替待ち保持(サンプル準拠)
  # --- 経路3: 完全停止デッドロック対策(2026-07-10追加、ユーザー承認済み) ---
  # 相手車(複数)に塞がれ続け、MPCがu0=0/infeas=0のまま「正しく」安全停止を選び続ける
  # デッドロックに対応する。経路1(u0/v)・経路2(infeasibility)はどちらも異常値の発生を
  # 前提とするため構造的に発動しない(実測: 予選0710-02で363秒間完全停止・0周・相手2台による封鎖)。
  stall_v_thr: 0.1       # [m/s] 「まったく動かない」判定(経路1のv_thr=0.3より厳格)
  stall_hold_cycles: 400 # [周期] 実速度がstall_v_thr未満でこれだけ継続→経路3判定(≈10s@40Hz)
  push_dist: 2.0         # [m] BACKUP後、前進突入(相手への押し出し)の目標距離
  push_speed: 3.0        # [m/s] 前進突入時の速度指令
  push_accel: 1.5        # [m/s^2] backup_accelを流用
  push_timeout_s: 5.0    # [s] 距離未到達でも打ち切る時間。周期数ではなく実時間で判定
                         #     (高負荷で周期が伸びても一定の実時間で確実に打ち切るため)
  # 2026-07-21追加(148節②): PUSH開始時、_plan_pass(ENGAGE判定と同じ関数)で決めた側へ
  # 操舵を加える(従来は操舵0固定の完全直進で、狙った側へ逃げる意図が無かった)。
  # 2026-07-24変更(171節続報、ユーザー指示「低速でステアリング舵角を最大まで使って
  # 障害物を回避」): 経路3専用の小角(6°)の「押し出し」から、経路1/2/3全てで発動する
  # 低速+最大舵角の回避走行へ拡張。push_steer_max_degは独自の値を持たず、コード側で
  # mpc.delta_max_deg(52°)をデフォルトとして参照する(「最大」の定義を1箇所に一元化)。
  # ここで明示的に上書きはしない(未設定のまま=mpc.delta_max_degに追従)。
  push_steer_room_ref: 1.0    # [m] この空きで上限角に到達(線形スケール、それ未満は比例縮小)
  stall_retry_budget_s: 360.0  # [s] 経路3の初回発火からこの時間内のみPUSHを再試行する
                         #     (無限リトライを避けるため、ユーザー指示により6分に設定)。実時間で判定
  # --- BACKUPウォッチドッグ(2026-07-13追加) ---
  # 0713-03実測: REVERSEギア確認済みでも実速度がv≈0のまま500秒以上固まり続け、ログの
  # 残り全体(復帰不能)となった事例を確認。PUSH/経路3には既に実時間タイムアウトが
  # あったが、BACKUP自体には無く、この穴が無限固着の直接原因だった。
  backup_timeout_s: 5.0        # [s] 後退距離未到達でも打ち切る時間(push_timeout_sと同値)。実時間で判定
  backup_retry_budget_s: 600.0 # [s] 初回タイムアウトからこの時間内のみWAIT_REVERSEへ再試行する
                         #     (無限リトライを避けるため、ユーザー指示により10分に設定)。実時間で判定
  # --- 後退不能検知(2026-07-14追加) ---
  # 0713-05実測: 後退方向に障害物があり物理的に動けない(実速度v≈0)のに、既存の
  # dist/timeout判定(5秒毎の再試行)を42回以上繰り返し、進捗距離が1.42m→0.00mへ
  # 単調悪化するだけで一度も回復せず、リトライ予算を消費し尽くすまで無理に押し続けて
  # いた。実速度が閾値未満のまま一定時間続いたら、5秒/600秒を待たずに即座に
  # 「後退方向に障害物があり不可能」と確定し、無理な後退を止める(ユーザー指示)。
  backup_blocked_v_thr: 0.05        # [m/s] この速度未満は「動いていない」とみなす
  backup_blocked_confirm_s: 1.5     # [s] この時間連続して動いていなければ後退不能と確定
  # --- 184節追加(2026-07-26、ユーザー指摘・提案): 壁リカバリー(90°自動修正)を
  # off化した(183節)ため、後退→単純な直進発進では同じ壁へ再突入する事例が
  # 増える見込みとなった。「後退時は隙間の中心へ先頭を向ける」「後退距離は
  # 後方の安全マージンから動的に決める」「1回で決着せず、縦列駐車の脱出のように
  # 短い後退→隙間への微調整前進を繰り返す(シャッフル)」の3点をここで追加する。
  gap_lookahead_n: 3          # [waypoint] 隙間中心の計算に使う先読み点数(update_path_constraints)
  ey_kp: 0.8                  # [rad/m] 隙間中心への横方向誤差に対する比例操舵ゲイン
  psi_kp: 1.0                 # [rad/rad] 経路接線とのヨー誤差に対する比例操舵ゲイン
  rear_clearance_margin_m: 0.5  # [m] 後方の相手車との間に残す安全マージン
  rear_scan_max_dist_m: 3.0     # [m] 後方チェックの探索範囲(これより遠い相手車は無視)
  push_heading_tol_deg: 15.0    # [deg] PUSH終了判定(cleared)で許容するヨー誤差
  shuffle_max_cycles: 6         # [回] 同一スタックエピソード内でBACKUP→PUSHを繰り返す上限
  # 2026-07-26追加(190-2節): ローカル3台走行(run_dev3_20260726_171301)で、path=3
  # (完全停止検知、count=400≒10.0秒@40Hz)経由のSTUCKが6回以上同一地点で再発したが、
  # 毎回のPUSH終了→次回検知までの間隔が実測10.2〜10.5秒と、旧値6.0秒を常に上回って
  # いたため「同一エピソード継続」と一度も認識されず、187節の反転リトライ(giveup_streak)
  # が一度も発動しないまま同じ失敗を繰り返していた。path=3自身の検知だけで最低10.0秒
  # かかる以上、6.0秒では構造的に足りない。10.0秒に余裕を持たせ15.0秒へ引き上げる
  # (radius_mによる位置一致判定は無変更、時間側のみ拡張)。
  shuffle_episode_gap_s: 15.0    # [s] 前回PUSH終了からこの時間内の再スタックは同一エピソード扱い
  shuffle_episode_radius_m: 3.0  # [m] 前回PUSH終了地点からこの距離内なら同一エピソード扱い
  # 2026-07-26追加(186節続報): 0726-01local試験で、シャッフル上限到達後の「復帰断念」が
  # 車が全く動けないまま約3秒周期で永久に繰り返され95秒以上回復しなかった事象への対処。
  max_giveup_streak: 3            # [回] シャッフル上限到達後、操舵方向を反転して再試行する回数の上限
  push_min_dist_for_cleared: 0.15  # [m] PUSH「reason=cleared」判定に必要な最小実移動量
  # --- 自動衝突検知(2026-07-10追加) ---
  # 予選環境のbagにはcondition系トピックがなく、既存の/aichallenge/pitstop/condition経由の
  # 検知(ピット専用の別目的ヒューリスティック)も0710-03の壁衝突を捕捉できなかった。
  # 実速度の1周期あたりの急落を自車のみで直接監視する。
  collision_suspect_dv: 0.8  # [m/s] 1周期での急落閾値。正当な制動(a_min=-1.37m/s²)の
                         #     上限(高負荷時のサイクル延びを見込んでも0.03-0.14m/s/周期)の
                         #     何倍もの余裕を持たせた値
  # 累積版(2026-07-11追加): 0711ローカルで2件の衝突を目視確認したが、上記の1周期版は
  # 一度も発火しなかった。低速域での接触は複数周期に分散する可能性があるため追加。
  collision_suspect_cum_dv: 1.0    # [m/s] 直近collision_cum_window_cycles周期の最大値からの下落閾値
  collision_cum_window_cycles: 5   # [周期] 監視窓幅(≈0.125s@40Hz)
  # GHOST-BLOCK(2026-07-11追加): 「知覚と現実の乖離」(コリドーはモデル上正常なのに実速度が
  # 落ちて動けない)の早期検知。経路1と同じカウンタを軽い閾値で監視し、ログのみ出す
  # (復帰動作はしない。経路1本発動=hold_cycles=120=3秒より早い段階で前兆を記録する)。
  ghost_block_hold_cycles: 40      # [周期] ≈1s@40Hz

# gate2: 前方車の追い越し（方式A: 回避ONのままコリドーが空き側を自動選択）
# 下記は「追い越し可否・方向の判断」と「追い越し中の速度」を外から調整するためのパラメータ。
# gate1（両側塞がり→停止）の挙動は overtake では変えない（STOPPING で従来通り停止）。
overtake:
  enable: true            # false にすると gate1 と同じ「前方車検知=即停止」に戻る
  min_gap: 2.5            # [m] 片側にこの空き幅(壁→最寄り他車の手前)があれば追い越し可能側とみなす
  block_half: 0.9         # [m] 他車1台が塞ぐ横半幅 = vehicle_radius + クリアランス
  max_consider: 20.0      # [m] この弧長より遠い前方他車は判断に使わない(40→20: 遠すぎる相手に
                          #     OVERTAKINGを早仕掛けしない。ACC検知(fwd_max_consider=20)とも一致)
  v_cap: 6.0              # [m/s] 追い越し中の速度上限（停止ではなく抜ける速度）
  exit_clear: 3           # 前方クリアがこの回数連続で OVERTAKING→NORMAL 復帰（ヒステリシス）
  # --- A: 追い越し側のコミット（左右フリップ=26回/走行 の抑制）---
  # side_deadband/corner_lookahead/corner_kappa_thr(2026-07-09削除): _choose_overtake_side
  #   フォールバックと共に削除。_plan_passがok=True時に常に非ゼロの側を返すため
  #   (2026-07-09修正J)、左右比較なしでロック側を再利用するこの経路は到達しなくなった上、
  #   「狭い側を誤って再選択」の原因になっていた(実測: 広い右3.46mを差し置いて左2.73mを再選択)。
  # --- Stage2 攻め: 相手速度に応じた追い越し判断（同等/速い相手を無駄に追わない=蛇行防止）---
  opp_obstacle_speed: 6.0 # [km/h] 相手がこれ未満=停止/ペナルティ車→障害物として空き側から抜く(コーナーでも隙間があれば)
  opp_min_closing: 0.7    # [m/s] エンゲージ閾値: 接近率(v_pot-v_opp)これ超で「追いつける」(0.5→0.7 ヒステリシス上側)
  # --- Fix-1(2026-07-04): OVERTAKINGコミット(ギクシャク対策: worth反転35回/走行・状態往復28回を抑制) ---
  opp_giveup_closing: 0.2 # [m/s] コミット中、接近率これ未満が giveup_cycles 連続で「本当に無理」→追従へ離脱
  giveup_cycles: 40       # [周期] ≈1秒@40Hz。1周期のworth=0では離脱しない(ランプ出戻り・Q切替の往復を根絶)
  engage_debounce: 8      # [周期] ≈0.2秒。worth=1がこれだけ連続して初めてエンゲージ(入りのフリッカー防止)
  engage_lat_max: 2.0     # [m] H2(2026-07-04): 相手のライン横位置|lat|がこれ以下=「進路上」の時だけエンゲージ。
                          #     進路外(ガレージ隣lat3.6等)へ±3mオフセットの無用な追い越しを仕掛けない(発進直進化)
  # 段階1 ego側ゲート(2026-07-04): 「今自分が相手より明確に遅い」時は仕掛けない。
  #   STARTやコーナー立ち上がりでego自身が加速ランプ中(v_pot過大評価)に、加速中の相手を追って
  #   蛇行→失速する問題を根治。追従中(ego≈相手)や停止車(障害物ルール)は従来通り抜ける。
  engage_ego_margin: 0.3  # [m/s] v_ego > v_opp - これ でのみエンゲージ(自分が相手より遅すぎない事)
  # 近接ゲート(2026-07-04): 「いざ追いついたタイミングで抜く」。相手が遠い(最大20m)うちに
  #   オフセットを開始すると、コーナーを跨いで壁に刺さる。ICCで追従して詰め、真後ろ(d_min≤これ)
  #   に来て初めて追い越しをcommitする。制約: ICCマージン fwd_margin_center(4m)より大きい事。
  engage_max_dist: 6.0    # [m] 前車との距離がこれ以下でのみエンゲージ(それまでは追従)
  # 側コミット(2026-07-04): 側は engage で1回だけ選ぶ。mid-pass反転(±3mスイング→gap拡大→
  #   スタック)は廃止。ロック側の空きが持続的に塞がれたら反対側へ飛ばず追従へ離脱。
  # 2026-07-10簡素化: 周期カウンタ(旧side_block_cycles)を廃止し、EMA(ema_alpha)一本化。
  #   実測: コーナー通過中の瞬時値の一瞬の凹みで、横並び済みでも誤って離脱・急減速していた。
  ema_alpha: 0.05         # EMA時定数(≈1秒@40Hz、giveupと同じスケールに統一)。side_block/along_lat共通
  # 再挑戦クールダウン(2026-07-04): 失敗離脱(側塞がり/give-up)の直後に0.2秒debounceだけで
  #   反対側に再エンゲージする高速ループ(±3スイングのエピソード間版)を抑制。追従で仕切り直す。
  engage_cooldown: 160    # [周期] ≈4秒@40Hz。失敗離脱後この間は再エンゲージしない(2→4秒 2026-07-04:
                          #   コーナー中の失敗はワンチャンス喪失=即再挑戦しても地形が許さない。~18m走行
                          #   =ヘアピン通過後に仕切り直してICCで整えて次ゾーンへ)
  # 完遂距離チェック(2026-07-04): 真横到達までの距離(≈v_pot·(d_min-1)/closing≈20m)以内に
  #   「きついコーナー」がある場所では仕掛けない(closing1m/s級では完遂不能=壁際で捨てる無理OTの根治)。
  #   閾値は側選択用corner_kappa_thr(0.05)と別: 0.05だと本コースは64%がコーナー扱い→全面禁止化
  #   するため、物理的にパス不能なR≤10m級のみブロック(実コース較正: 可能区間 s=18-45/81-91/130-138)。
  t_lateral: 3.0          # [s] 横移動フェーズの所要時間(engage→クリアの実測3秒。この間ICC箱入りで
                          #   closing≈0)。完遂距離 = v_pot·(t_lateral + 真横到達時間) に使用
  # 内側可否(2026-07-05 ユーザー要件:「直線で並び切れるなら内側OK」): 抜き切り(相手の前へ
  #   pass_clear 出る)がきついコーナー(|κ|≥pass_block_kappa)進入までに完了しない場合、その
  #   コーナーの内側は選ばない(内側レーンはアペックスで消滅、実測lane 0.61m@s72)。加えて
  #   OVERTAKING中はオフセット実効曲率 κ/(1−κ·e_y) ベースの動的減速が常時かかる(内側=R縮小に対応)
  pass_block_kappa: 0.10  # [1/m] きついコーナー閾値(R≤10m)
  pass_clear: 3.0         # [m] 抜き切り=相手の前にこれだけ出る
  # 遠回り会計(2026-07-04): 外側ラインは ∫|κ|·d_off ds 長い(R=6ヘアピン+3m≈5m=closing1.4で
  #   3.6秒분の追い付きが消える)。側別の所要時間 T=t_lateral+(gap+遠回り)/closing がこの予算を
  #   超えるなら「追従の方がロスが少ない」ので仕掛けない。実測「外回りしたが抜けない」の対策
  pass_t_max: 8.0         # [s] パス所要時間の予算
  # 被追い越し判定のデバウンス(2026-07-05): 生値は境界(|ds|≤3m, dlat≥1.0m, v≥6km/h)素通しで
  #   追従中に毎周期フラップし、STOPPINGの use_obstacle_avoidance(コリドー生成元 動的↔静的)を
  #   直接トグル→横コリドー離散ジャンプ→追従中の蛇行。ON/OFF確定に連続周期数を要求する。
  def_enter_cycles: 5     # [周期] ≈0.12s連続TrueでON(守り発動は素早く)
  def_exit_cycles: 15     # [周期] ≈0.38s連続FalseでOFF(解除はゆっくり=チャタ防止)
  # H4-lite(2026-07-04): infeasible自己ロック(壁際でMPC不可解→u0=0のまま20秒級停止。実測2回で
  #   計45秒損失)の前進リカバリ。発動中はマージン0.2+強funnelで現在位置から解ける問題に再構成。
  unlock_inf_cycles: 80   # [周期] inf連続がこれ以上 かつ 車速<0.3m/s で発動(≈2秒)
  unlock_hold_cycles: 60  # [周期] 発動後の保持時間(≈1.5秒。抜けなければ再発動)
  # --- Fix-2(2026-07-04): ICC解放ヒステリシス(「横1.8mで即全開→コーナー収束で接触」3件の対策) ---
  clear_lat_release: 2.1  # [m] 実横間隔これ以上で「クリア」→ICC解放(1.8+0.3のヒステリシス)
  clear_ds_beside: 1.0    # [m] または 横1.8m以上かつ前後差これ以下(=真横到達)で解放
  clear_lat_reacquire: 1.6 # [m] クリア後もこれ未満に再接近したら再びICC対象(コーナー収束の再接近を捕捉)
  # --- C 守り: 被追い越し(横並び/後方から速い車)時は押し込まず、壁近接なら減速 ---
  def_alongside_dist: 3.0 # [m] |ds|がこれ以内かつ横にずれている=横並び→攻めのオフセット押し込みを抑制
  def_alongside_lat: 1.0  # [m] 横並び判定に必要な横オフセット下限。真正面の追従相手(|lat|小)を誤って「横並び」
                          #     と判定し回避ON/OFFがトグル→コリドーがパタつく問題(2026-07-03解析)の修正
  def_rear_dist: 8.0      # [m] 後方この距離以内に自車より速い車→被追い越しと判定
  def_rear_faster: 1.0    # [m/s] 後方車が自車より これ以上速ければ「抜かれる」と判定
  # 2026-07-19修正(123節): 122節でwall_slowの判定基準を静的wp.ub/lb(safety_margin未控除)
  #   からMPC自身が実際に追従する動的dbg_corr_ub0/lb0(NORMAL時width/√2≈1.626m・
  #   OVERTAKING時0.8mのsafety_margin控除済み)へ切替えた際、この閾値(0.5)を旧方式
  #   向けのまま据え置いてしまい、0719-05実測で二重マージン化(既にマージン込みの値へ
  #   さらに0.5m要求)による過剰発火(NORMAL・対戦車無しの安全なコーナーの過半数で
  #   介入、Lap1が240秒まで悪化)を引き起こした。実測(wp330-336)で本来検知すべき
  #   超過はmargin=0.046m相当だった一方、安全なNORMALコーナーのp10は0.43mだったため、
  #   両者を分離できる0.15へ再較正する(新規パラメータ0個、既存値の変更のみ)。
  # 2026-07-23追加(166節続報): wp257(コース最急コーナー直後)の揺れの原因切り分け実験用スイッチ。
  #   trueで従来通り(壁近接減速あり)、falseで完全に無効化(壁への安全マージンが無くなる点に
  #   注意。単走・低速での切り分け実験専用。恒久的にfalseで運用しないこと)。
  wall_slow_enable: false  # 2026-07-23: ユーザー指示によりOFFのまま操舵振動の切り分けを継続
  wall_slow_margin: 0.15  # [m] dbg_corr_ub0/lb0(safety_margin込み)境界までの追加余裕。これ未満で壁近接減速(テーパー開始点)
  wall_slow_speed: 2.0    # [m/s] 壁近接時の速度上限(テーパー下限、実際に境界へ到達した時点)
  # 2026-07-19追加(124節): 123節の再較正後もmargin=+0.01〜+0.15(未逸脱)の27箇所で
  #   一律にwall_slow_speedへ急減速し、1周あたり約4秒の不要な減速(83秒→87秒)を招いて
  #   いた(122節以前の静的テーブル方式では同じ27箇所とも発火していなかったことを遡及
  #   検証済み)。既存のicc_f3テーパー(hard_stop_gap〜f3_taper_gap)と同じ考え方で、
  #   wall_slow_margin(テーパー開始点)〜wall_slow_margin_hard(この値以下で完全に
  #   wall_slow_speedへ)の間を線形補間する。
  wall_slow_margin_hard: 0.0  # [m] これ以下で完全にwall_slow_speedへ(実際にコリドー境界へ到達)
  # --- 並走の「ねばり」: 真横に並ばれても自分のレーンが確保できる限り減速しない(2026-07-03) ---
  #   自分側レーン幅 = 相手の自分側エッジ〜自分側の壁 を現在+先読みwpで評価。
  #   lane >= lane_need         → そのまま並走(ねばる)
  #   lane <  lane_need         → 走行継続困難 → 相手より少し遅くして後ろへ下がる(横並び解消→ICCへ)
  #   lane <  カート幅(1.45)    → 物理的に不可 → wall_slow_speed まで減速
  alongside_lane_need: 1.85   # [m] 並走継続に必要な自分側レーン幅(カート幅1.45+余裕0.4)
  alongside_lookahead: 8.0    # [m] レーン幅を先読みする弧長(コーナーで壁が迫るのを事前検知)
  alongside_min_width: 1.45   # [m] カート幅未満の物理下限(2026-07-10: named定数化。
                               #     横並び済み後のside_block緩和閾値にも同じ値を再利用)
  # 2026-07-20追加(127節続報、0720-01予選ログwp173の異常接近分析): fwd_dlat(横間隔)は
  #   従来along_min_width(横方向の物理下限)とのみ比較されており、fwd_ds(縦間隔)には
  #   対応する「車体全長ベースの物理下限」が一度も存在しなかった。公式車両仕様
  #   (全長200cm/全幅145cm、ユーザー提供)より、同型カート2台なら「両車の半長合計」=
  #   「1台分の全長」となる(along_min_widthが「両車の半幅合計=1台分の全幅」であるのと
  #   同じ関係)。self._mpc.model.length(1.087)はホイールベース(自転車モデルの運動学
  #   パラメータ)であり車両全長ではないため、当たり判定には流用せず本値を新設する。
  along_min_length: 2.00      # [m] カート全長未満の物理下限(fwd_dlat<along_min_width かつ
                               #     fwd_ds<along_min_length で車体重なりリスクありと判定)
  # 案B(2026-07-11): 側消失(_side_blocked)によるSTOPPING離脱後、同一対象車への短時間
  #   再エンゲージでは側反転を抑止する(0710-06実測: wp176-178でside+1→-1反転直後に
  #   実速度が0.18m/sへ8秒張り付いた事象への対策)。giveup/infeasible離脱は対象外。
  side_flip_hysteresis_s: 3.0  # [s] この時間内・同一対象車なら前回側を優先
  debug: true            # gate2課題切り分けのため一時的にON（[OT]ログ: state/side/Lfree/Rfree）。確定後OFFへ
  # --- 修正3: ヒステリシス＋安全フォールバック ---
  gap_hys: 0.5           # [m] OVERTAKING維持の緩和量（min_gap-gap_hys を下回ったら離脱）
  # (v_min は統一ICC化(2026-07-03)で v_creep+hard_stop_gap に置換され廃止)
  infeasible_stop: 15    # MPCがこの回数連続infeasible（実際に通れない）なら安全STOPへ（修正③で緩和: 一時的infeasibleでは止めない）
  infeasible_latch: 40   # 安全STOP後、OVERTAKING再挑戦を抑制する周期数（オシレーション防止）
  # --- 方式B: 空き側へ e_y 目標をオフセット（発進時ランプ付き）---
  d_off: 3.0             # [m] 参照ラインから空き側へ寄せる量（クリアに足りる量＝約2.6m寄り。戻りfunnelで復帰）
  proactive_bias_max: 0.3  # [m] 2026-07-22追加(issue⑤①): STOPPING中、_plan_pass判定成立時に
                         #   停止/低速の相手へ先行して寄せる量の上限（d_offより十分小さく、
                         #   _corr_bound_ahead()の動的クランプ後はさらに縮小される想定）
  ramp_time: 2.5         # [s] オフセット 0→full の漸増時間。0.5→2.5(2026-07-05): 計画(t_lateral=3s)
                         #   と参照の不整合が急ハンドル+失速の原因だった(0.5sで±3m=経路角30°要求)。
                         #   参照と車体が一緒に動く自然な車線変更ラインへ(psi_biasもランプ済み目標へ変更)
  psi_bias_max_deg: 20.0 # B-lite: ヘディング参照を開き側へ傾ける上限[deg]（到達可能な補助。横移動の主役はd_off）
  funnel_steps: 12       # 「徐々に右」: コリドーを現在e_yから何wpかけて回避形状へ遷移させるか（feasible維持・ブレーキ防止）
  # --- アグレッシブ追い越し（実寸ベースの安全マージン＋crab前倒し＋安全網）---
  safety_margin_overtake: 0.8  # [m] 追い越し中の安全マージン（自車実footprint。通常1.63より縮小、壁・相手共通）
  q_ey_overtake: 5000000.0     # 追い越し中の Q[e_y]（通常6e5→front-load。計画した右経路を早期実行）
  # --- Q曲率スケジュール(v1-v5)は2026-07-24(174節)、予選環境の「全体的な蛇行」原因切り分けの
  #   A/Bテストとして再撤去。Q[e_y]ベース値(3M、確定済み)は上のstatic Qのみで不変。
  #   経緯はmpc_controller.py該当箇所のコメント参照(170/171/174節)。
  # (safe_clear_dist/safe_brake_dist は統一ICC化(2026-07-03)で「実横間隔<1.8m=常時減速対象」に置換され廃止。
  #  横クリア閾値は ICC 側の実横間隔 1.8m がその役割を担う)
  # --- F3クリープ: 停止車の後ろでのデッドロック対策(2026-07-03: 停止d2の3m後ろでv_safe=0→7.8s固まる) ---
  #   完全停止すると横移動を作れず抜け出せない。側の空きOK済みのOVERTAKING中は、実ユークリッド距離が
  #   hard_stop_gap を切るまではクリープ前進を許し、斜め前進で横オフセットを育てて抜け出す。
  v_creep: 1.5                 # [m/s] 未クリア時のクリープ前進速度(安全網の下限を停止→これに)
  hard_stop_gap: 1.8           # [m] 相手との実距離(√(ds²+Δlat²))がこれ未満なら完全停止(最後の防壁, =safe_clear)
  # F3フロア比例化(2026-07-13追加): 0713-03実測(wp169-178)で、floorがv_creep⇔0を二値で
  # 行き来するバンバン制御が、相手が徐行の場合にリミットサイクル振動(停止・再接近の繰り返し)を
  # 引き起こすことを確認。hard_stop_gap〜f3_taper_gapの間を線形補間しfloorを滑らかに変化させる。
  f3_taper_gap: 3.0             # [m] この距離以上でv_creepへ復帰。hard_stop_gap未満は従来通り完全停止
  return_done_ey: 0.7          # [m] 追い越し後 |e_y|<これ でライン復帰完了とみなし、戻りfunnelを解除

# 発進地点(車庫/ピット)とコース上を自動判別し、参照経路と速度を切り替える。
# gate1/gate2/gate3/eval 共通で機能（モード指定不要）。
#  - 発進時: レースライン距離が遠い→ピット経路(from_garage)、近い→レースライン。
#  - 走行中: レースラインに近づいたら(コースイン)レースライン(周回)へ一度だけ切替。
pit_lane:
  enable: true
  csv_pkg: "simple_trajectory_generator"               # ピット経路CSVのあるパッケージ
  csv_rel: "data/raceline_awsim_30km_from_garage.csv"  # 車庫発進経路（x,y,...,speed 列）
  enter_dist: 5.0        # [m] 発進時 レースライン距離>これ で「ピット」と判定
  course_in_dist: 3.0    # [m] レースライン距離<これ で「コースイン」→レースラインへ切替
  course_in_count: 5     # コースイン判定の連続周期数（ヒステリシス）
  v_max_pit_kmh: 3.0     # [km/h] ピット走行中の速度上限。狭い車庫出口の急曲がりを丁寧に通すため低速。
  q_ey_pit: 50000000.0   # ピット走行中の Q[e_y]（通常6e5→大幅強化 5e7）。狭部で Q[e_psi]=1e8 に対抗し
                         # レーン中央へ確実に寄せる（from_garage平行の右張り付きを解消）。左壁はコリドーが防ぐため安全。
  densify_resolution: 0.3 # [m] from_garage(約3m間隔)を3次スプラインで平滑・高密度化する間隔。狭路の曲がりを滑らかに追従。
  # --- 壁制約(lanelet2ピット境界をMPCハードコリドーに使う) ---
  # 占有格子はピットで不正確なため、lanelet2地図のピットレーン左右境界を壁の真値として使う。
  # 各wpの ub/lb を境界から計算→ update_simple_path_constraints が下記マージンを引いてコリドー化。
  # MPCはコリドー中央を横目標にし、e_yを壁内にハード拘束する（参照線の横位置に依存しない）。
  lanelet_pkg: "aichallenge_submit_launch"   # lanelet2地図のあるパッケージ
  lanelet_rel: "map/lanelet2_map.osm"        # lanelet2地図(local_x/y, 同一座標系)
  safety_margin_pit: 0.9 # [m] ピット静的コリドーのマージン。実カート半幅0.725+緩衝0.175。
                         # 最狭レーン2.48mでもコリドー≥0.68m(feasible)、カート端は壁から最低0.175m(中央追従時~0.5m)。
  # --- ピット低速時の方位補正 ---
  # EKF方位は低速で実方位から約15-19°ずれ、MPCが「レーンに合わせる」ため右へ過剰操舵し右壁へ。
  # ピット中はGNSS位置履歴から求めた実進行方位をMPCに与える（位置もGNSSで自己整合）。
  heading_track_dist: 0.4 # [m] 進行方位を求めるGNSS履歴の後方距離。短いほど追従↑だがノイズ↑。
