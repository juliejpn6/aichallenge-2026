/**:
  ros__parameters:
    # GNSS measurement covariance (adjust_covariance: maps GNSS accuracy to EKF input)
    gnss_covariance:
      # 再較正(2026-07-19、117節): 単独走行ログ(run_perffix_20260719_110700)の実測で、
      #   このAWSIM環境の生GNSS共分散(/sensing/gnss/pose_with_covariance)は全8479サンプル
      #   で定数10.0固定と判明(シミュレータの固定ノイズモデルによる自己申告値、実際の受信
      #   状態を反映しない)。旧good_threshold=0.1では常にmoderate_threshold(0.5)も超えて
      #   poor_value(100.0)固定となり、2026-07-05にチューニングしたgood_value(0.05)が
      #   この環境では一度も発火していなかった。
      #   一方、自己申告値と無関係な独立2手法(直線あてはめ残差RMS=平均0.052m/847窓、
      #   周回再現性=11地点で0.015〜0.200m)で実際のGNSS精度を検証したところ、自己申告が
      #   示唆するσ≈3.16m(=sqrt(10.0))の約60〜180倍良い(実際はσ≈0.05m級)と確認した。
      #   既知の動作点(10.0)がgood_valueへ分類されるようgood_thresholdのみ引き上げる。
      good_threshold: 12.0
      # 2026-07-23決定実験(166節続報): good_value=0.05(標準偏差換算0.224m)は独立実測の
      #   真の精度(標準偏差0.052m、分散換算0.0027)の約18倍過大と判明。0.01へ引き下げた
      #   結果、[LOC-XCHECK]で傾き(diff∝kappa)0.673→0.752(wz_c単体時、悪化)→0.594
      #   (0.01、改善)、急コーナーRMS0.176→0.168→0.129、既知ホットスポット(wp165/210/
      #   240/270)でも21〜36%の追加改善を確認。さらに0.003まで下げたところ、EKFの
      #   サンプル間ラフネスがGNSS本体より粗くなり(0.186 vs 0.141、0.01時点では0.093 vs
      #   0.088と既に境界線だった)、直線RMSが0.023→0.075mへ悪化する過剰追従(オーバー
      #   シュート)を確認したため0.01へ戻した。0.01が現時点の決定値
      #   (wp_id_offset実験と同じ「一段行き過ぎたら手前へ戻す」パターン)。
      # 0.01→0.03実験(2026-07-24)→撤回: diff∝kappaの傾きが0.594→0.811へ悪化(急コーナー
      # RMSも0.129→0.132で微悪化)。体感では違いが分からなかったが、数値では明確に0.01が
      # 優れていた。0.01が引き続き決定値。
      good_value: 0.01
      moderate_threshold: 50.0  # good_thresholdとの相対比(旧0.1:0.5=1:5)を概ね維持し、万一
      #   raw共分散が10.0から大きく外れた場合の階梯を保持する(実測データなし、安全側の据え置き)。
      moderate_value: 0.25
      poor_value: 100.0
      roll: 100000.0
      pitch: 100000.0
      yaw: 100000.0

    # Initial pose covariance (for /set_initial_pose and first initial_pose3d)
    initial_pose_covariance:
      x: 0.25
      y: 0.25
      yaw: 0.5

    # GNSS-track heading injection: 走行中、GNSS位置履歴から進行方位を求めて EKF の yaw 観測として与え、
    #   gyro 積分だけでは残る方位バイアス(約-1.5°)を絶対方位で補正する。低速時はゲートで従来挙動へ退避。
    gnss_heading:
      enable: true
      track_dist: 0.5        # [m] 進行方位を求める後方距離(長いほど低ノイズ・コーナーで遅れ大)
      max_dt: 1.0            # [s] 後方点がこれより古い=低速/停止 → 注入せず従来(cov=100000)へ
      yaw_covariance: 0.2    # [rad^2] 注入方位の観測分散(保守的=大きめ。速い動特性はgyro, バイアス補正をGNSS)
